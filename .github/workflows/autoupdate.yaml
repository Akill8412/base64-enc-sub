name: Update Subscription

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python and Xray-core
        run: |
          pip install aiohttp
          curl -L -o xray.zip ://github.com
          unzip -q xray.zip -d xray_bin
          chmod +x xray_bin/xray

      - name: Fetch, check and build subscriptions
        env:
          XRAY_PATH: ./xray_bin/xray
          SUB_URLS: |
            zieng2:https://bitbucket.org/zieng2/wl/raw/main/vless_universal.txt
            igareck:https://bitbucket.org/igareck/vpn-configs-for-russia/raw/main/Export/v2rayN_PC/WHITE-CIDR-RU-all-v2rayN.txt
            whoahaow:https://raw.githubusercontent.com/whoahaow/rjsxrd/refs/heads/main/githubmirror/bypass/bypass-all.txt
        run: |
          python3 process_subs.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@://github.com"
          
          rm -rf xray_bin xray.zip Sub.txt index.html zieng2.txt igareck.txt whoahaow.txt
          git add -A
          
          if ! git diff --staged --quiet; then
            git commit -m "Auto-update checked subscriptions"
            git push
          else
            echo "No changes to commit."
          fi
