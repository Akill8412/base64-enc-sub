name: Update Subscription

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python and Xray-core
        run: |
          pip install aiohttp
          curl -L -o xray.zip https://github.com/XTLS/Xray-core/releases/latest/download/Xray-linux-64.zip
          unzip -q xray.zip -d xray_bin
          chmod +x xray_bin/xray

      - name: Fetch, check and build subscriptions
        env:
          XRAY_PATH: ./xray_bin/xray
          SUB_URLS: |
            LinSpisokObhod:https://raw.githubusercontent.com/LSO-LinSpisokObhod/LSO-LinSpisokObhod.github.io/refs/heads/main/sub/ALL.txt
            whoahaow:https://raw.githubusercontent.com/whoahaow/rjsxrd/refs/heads/main/githubmirror/bypass/bypass-all.txt
            zieng2:https://bitbucket.org/zieng2/wl/raw/main/vless_universal.txt
            igareck:https://bitbucket.org/igareck/vpn-configs-for-russia/raw/b2656fb8c188a36b25075fc206c2f4d44f01b4e9/WHITE-CIDR-RU-all.txt
            Ilyacom4ik_1:https://raw.githubusercontent.com/Ilyacom4ik/free-v2ray-2026/refs/heads/main/subscriptions/FreeCFGHub1.txt
            Ilyacom4ik_2:https://raw.githubusercontent.com/Ilyacom4ik/vpn-keys/refs/heads/main/allkeysFreeCFGHub.txt
            Maskkost93_1:https://raw.githubusercontent.com/Maskkost93/kizyak-vpn-4.0/refs/heads/main/kizyakbeta6.txt
            Maskkost93_2:https://raw.githubusercontent.com/Maskkost93/kizyak-vpn-4.0/refs/heads/main/kizyakbeta7.txt
            RKP:https://raw.githubusercontent.com/RKPchannel/RKP_bypass_configs/refs/heads/main/whitelist.txt
            Buffetbarko:https://raw.githubusercontent.com/Buffetbarko/Universal-Proxy-Config-Parser-/main/whitelist_vpn.txt
            hentai_goida:https://raw.githubusercontent.com/ArtemAfonasyev/hentai-goida-subscription/refs/heads/main/subscription-ru.txt
            shadow_cat:https://raw.githubusercontent.com/ShadowException/VPN/refs/heads/main/configs/VPN-cat
            mygalaru:https://raw.githubusercontent.com/btsk161/Freeinternet_byMygalaru.github.io/refs/heads/main/premium.txt
            swordware:https://raw.githubusercontent.com/mbelspb-gif/ffsfsfssdf/refs/heads/main/TG-swordware
            v0id9:https://raw.githubusercontent.com/v0id9/vpn-configs/refs/heads/main/vpn.txt
        run: |
          python3 process_subs.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          rm -rf xray_bin xray.zip Sub.txt index.html zieng2.txt igareck.txt whoahaow.txt
          git add -A
          
          if ! git diff --staged --quiet; then
            git commit -m "Auto-update checked subscriptions"
            git push
          else
            echo "No changes to commit."
          fi
