name: Update Subscription

on:
  schedule:
    # Запуск каждый час в 00 минут
    - cron: '0 * * * *'
  # Кнопка для ручного запуска во вкладке Actions
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch and merge subscriptions
        env:
          # Укажите ваши ссылки (по одной на каждой строке)
          SUB_URLS: |
            https://raw.githubusercontent.com/zieng2/wl/refs/heads/main/vless_universal.txt
            https://bitbucket.org/igareck/vpn-configs-for-russia/raw/main/Export/v2rayN_PC/WHITE-CIDR-RU-all-v2rayN.txt
            https://raw.githubusercontent.com/whoahaow/rjsxrd/refs/heads/main/githubmirror/bypass/bypass-all.txt
        run: |
          python3 - << 'EOF'
          import os
          import base64
          import urllib.request

          urls = [u.strip() for u in os.environ.get("SUB_URLS", "").splitlines() if u.strip()]
          all_configs = []

          def try_b64_decode(data: str) -> str:
              # Пробуем декодировать, если источник уже в Base64
              cleaned = "".join(data.split())
              # Добавляем недостающий padding '=' при необходимости
              padding = len(cleaned) % 4
              if padding:
                  cleaned += "=" * (4 - padding)
              try:
                  decoded = base64.b64decode(cleaned).decode("utf-8")
                  # Проверяем, похоже ли содержимое на ссылки протоколов
                  if "://" in decoded:
                      return decoded
              except Exception:
                  pass
              return data

          for url in urls:
              try:
                  req = urllib.request.Request(url, headers={"User-Agent": "v2rayNG/1.8.5"})
                  with urllib.request.urlopen(req, timeout=20) as resp:
                      raw_text = resp.read().decode("utf-8", errors="ignore").strip()
                      decoded_text = try_b64_decode(raw_text)
                      for line in decoded_text.splitlines():
                          line = line.strip()
                          if line and "://" in line and line not in all_configs:
                              all_configs.append(line)
                  print(f"OK: {url}")
              except Exception as e:
                  print(f"ERROR fetching {url}: {e}")

          if not all_configs:
              raise RuntimeError("Не удалось получить ни одного профиля ни с одного URL!")

          merged_plain = "\n".join(all_configs)
          merged_b64 = base64.b64encode(merged_plain.encode("utf-8")).decode("utf-8")

          # 1. Записываем чистый Base64 в Sub.txt в корне репозитория
          with open("Sub.txt", "w", encoding="utf-8") as f:
              f.write(merged_b64)

          # 2. Опционально: генерируем index.html для Яндекс.Переводчика (если используете GitHub Pages)
          html_content = f'<!DOCTYPE html><html><head><meta charset="utf-8"></head><body><pre translate="no">{merged_b64}</pre></body></html>'
          with open("index.html", "w", encoding="utf-8") as f:
              f.write(html_content)

          print(f"Собрано уникальных профилей: {len(all_configs)}")
          EOF

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@://github.com"
          git add Sub.txt index.html
          if ! git diff --staged --quiet; then
            git commit -m "Auto-update Sub.txt"
            git push
          else
            echo "No changes to commit."
          fi
