name: Update Subscription

on:
  # Кнопка для ручного запуска во вкладке Actions
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch and merge subscriptions
        env:
          SUB_URLS: |
            zieng2:https://bitbucket.org/zieng2/wl/raw/main/vless_universal.txt
            igareck:https://bitbucket.org/igareck/vpn-configs-for-russia/raw/main/Export/v2rayN_PC/WHITE-CIDR-RU-all-v2rayN.txt
            whoahaow:https://raw.githubusercontent.com/whoahaow/rjsxrd/refs/heads/main/githubmirror/bypass/bypass-all.txt
        run: |
          python3 - << 'EOF'
          import os
          import base64
          import urllib.request
          import time
          import re
          from collections import OrderedDict

          entries = []
          for line in os.environ.get("SUB_URLS", "").splitlines():
              line = line.strip()
              if not line or line.startswith("#"):
                  continue
              if ":" not in line:
                  print(f"SKIP (нет формата name:url): {line}")
                  continue
              name, url = line.split(":", 1)
              name, url = name.strip(), url.strip()
              if not name or not url:
                  continue
              if any(c in name for c in '/\\:*?"<>|'):
                  print(f"SKIP (недопустимые символы в имени): {name}")
                  continue
              entries.append((name, url))

          def try_b64_decode(data: str) -> str:
              # Проверяем, похоже ли содержимое на строгий Base64
              cleaned = "".join(data.split())
              if re.fullmatch(r'^[A-Za-z0-9+/]+={0,2}$', cleaned) and len(cleaned) % 4 == 0:
                  try:
                      decoded = base64.b64decode(cleaned).decode("utf-8")
                      if "://" in decoded:
                          return decoded
                  except Exception:
                      pass
              return data

          configs_by_name = OrderedDict()

          for name, url in entries:
              configs_by_name.setdefault(name, [])
              success = False
              
              # Делаем до 3 попыток скачивания
              for attempt in range(3):
                  try:
                      req = urllib.request.Request(
                          url,
                          headers={"User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"}
                      )
                      with urllib.request.urlopen(req, timeout=30) as resp:
                          raw_text = resp.read().decode("utf-8", errors="ignore").strip()
                      
                      decoded_text = try_b64_decode(raw_text)
                      for line in decoded_text.splitlines():
                          line = line.strip()
                          if line and "://" in line and line not in configs_by_name[name]:
                              configs_by_name[name].append(line)
                      
                      print(f"OK [{name}]: {url} (найдено {len(configs_by_name[name])} конфигов)")
                      success = True
                      break # Выходим из цикла попыток, если успешно
                  except Exception as e:
                      print(f"WARNING [{name}] Попытка {attempt+1} не удалась: {repr(e)}")
                      time.sleep(2) # Ждем 2 секунды перед повторной попыткой

              if not success:
                  print(f"ERROR [{name}] Не удалось скачать файл после 3 попыток.")

          if not any(configs_by_name.values()):
              raise RuntimeError("Не удалось получить ни одного профиля ни с одного URL!")

          for name, configs in configs_by_name.items():
              if not configs:
                  print(f"ВНИМАНИЕ: нет профилей для '{name}', файл не создан.")
                  continue
              merged_plain = "\n".join(configs)
              merged_b64 = base64.b64encode(merged_plain.encode("utf-8")).decode("utf-8")
              filename = f"{name}.txt"
              with open(filename, "w", encoding="utf-8") as f:
                  f.write(merged_b64)
              print(f"'{name}': {len(configs)} уникальных профилей -> {filename}")
          EOF

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Удаляем старые файлы, если они остались
          rm -f Sub.txt index.html
          
          # Добавляем все изменения
          git add -A
          
          if ! git diff --staged --quiet; then
            git commit -m "Auto-update subscription files"
            git push
          else
            echo "No changes to commit."
          fi
