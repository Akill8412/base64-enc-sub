name: Update Subscription

on:
  # Кнопка для ручного запуска во вкладке Actions
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch and merge subscriptions
        env:
          # Формат: name:url (по одной паре на строку)
          # Если несколько URL с одинаковым name — они будут объединены в один файл <name>.txt
          SUB_URLS: |
            Zieng2:https://raw.githubusercontent.com/zieng2/wl/refs/heads/main/vless_universal.txt
            igareck:https://bitbucket.org/igareck/vpn-configs-for-russia/raw/main/Export/v2rayN_PC/WHITE-CIDR-RU-all-v2rayN.txt
            whoahaow:https://raw.githubusercontent.com/whoahaow/rjsxrd/refs/heads/main/githubmirror/bypass/bypass-all.txt
        run: |
          python3 - << 'EOF'
          import os
          import base64
          import urllib.request
          from collections import OrderedDict

          entries = []
          for line in os.environ.get("SUB_URLS", "").splitlines():
              line = line.strip()
              if not line or line.startswith("#"):
                  continue
              if ":" not in line:
                  print(f"SKIP (нет формата name:url): {line}")
                  continue
              name, url = line.split(":", 1)
              name, url = name.strip(), url.strip()
              if not name or not url:
                  print(f"SKIP (пустое имя или url): {line}")
                  continue
              # Простая защита от недопустимых имён файлов
              if any(c in name for c in '/\\:*?"<>|'):
                  print(f"SKIP (недопустимые символы в имени): {name}")
                  continue
              entries.append((name, url))

          def try_b64_decode(data: str) -> str:
              # Пробуем декодировать, если источник уже в Base64
              cleaned = "".join(data.split())
              padding = len(cleaned) % 4
              if padding:
                  cleaned += "=" * (4 - padding)
              try:
                  decoded = base64.b64decode(cleaned).decode("utf-8")
                  if "://" in decoded:
                      return decoded
              except Exception:
                  pass
              return data

          # Группируем конфиги по name
          configs_by_name = OrderedDict()
          for name, url in entries:
              configs_by_name.setdefault(name, [])
              try:
                  req = urllib.request.Request(url, headers={"User-Agent": "v2rayNG/1.8.5"})
                  with urllib.request.urlopen(req, timeout=20) as resp:
                      raw_text = resp.read().decode("utf-8", errors="ignore").strip()
                  decoded_text = try_b64_decode(raw_text)
                  for line in decoded_text.splitlines():
                      line = line.strip()
                      if line and "://" in line and line not in configs_by_name[name]:
                          configs_by_name[name].append(line)
                  print(f"OK [{name}]: {url}")
              except Exception as e:
                  print(f"ERROR [{name}] fetching {url}: {e}")

          if not any(configs_by_name.values()):
              raise RuntimeError("Не удалось получить ни одного профиля ни с одного URL!")

          written_files = []
          for name, configs in configs_by_name.items():
              if not configs:
                  print(f"SKIP: нет профилей для '{name}'")
                  continue
              merged_plain = "\n".join(configs)
              merged_b64 = base64.b64encode(merged_plain.encode("utf-8")).decode("utf-8")
              filename = f"{name}.txt"
              with open(filename, "w", encoding="utf-8") as f:
                  f.write(merged_b64)
              written_files.append(filename)
              print(f"'{name}': {len(configs)} уникальных профилей -> {filename}")

          # Список файлов для шага коммита
          with open(".written_files", "w", encoding="utf-8") as f:
              f.write("\n".join(written_files))
          EOF

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -f .written_files ]; then
            while IFS= read -r file; do
              [ -n "$file" ] && git add "$file"
            done < .written_files
          fi
          rm -f .written_files
          if ! git diff --staged --quiet; then
            git commit -m "Auto-update subscription files"
            git push
          else
            echo "No changes to commit."
          fi
